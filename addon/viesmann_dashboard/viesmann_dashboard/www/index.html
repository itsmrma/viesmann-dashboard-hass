<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Casa · Riscaldamento</title>
  <style>
    :root{font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f3f6f7;--surface:#fff;--surface-2:#f7f9fa;--text:#17252b;--muted:#60747c;--line:#e2e9eb;--accent:#176f68;--accent-soft:#e4f3ef;--warning:#9b6710;--warning-soft:#fff3d6;--danger:#a3443d;--shadow:0 10px 30px #152a3210;background:var(--bg);color:var(--text)}
    :root[data-theme="dark"]{--bg:#11191c;--surface:#1c272b;--surface-2:#222f33;--text:#e9f0f1;--muted:#a4b4b8;--line:#344247;--accent:#76c9b4;--accent-soft:#1d3b36;--warning:#f0c66c;--warning-soft:#3d3320;--danger:#f08c80;--shadow:0 10px 30px #0003}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}button,select{font:inherit;color:inherit}main{max-width:1160px;margin:auto;padding:32px 24px 60px}.topbar,.heading,.section-head,.room-link,.reading,.source-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar{margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:22px}.brand small,.muted,.eyebrow{color:var(--muted)}.brand strong{display:block;font-size:.96rem}.brand small{font-size:.77rem}.theme-picker{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.8rem}.theme-picker select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 10px}.heading{align-items:flex-end;margin:0 0 20px}.eyebrow{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.heading h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.12;letter-spacing:-.04em;margin:7px 0 4px}.heading p{margin:0;color:var(--muted)}.status-chip,.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:6px 10px;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.status-chip.stale{background:var(--warning-soft);color:var(--warning)}.status-chip.unavailable{background:var(--surface-2);color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:4px;margin:0 0 22px;border-bottom:1px solid var(--line)}.tab{display:block;white-space:nowrap;padding:9px 13px;border-radius:10px 10px 0 0;color:var(--muted);font-size:.88rem;font-weight:650}.tab:hover{background:var(--surface-2);color:var(--text)}.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0}.card h2{font-size:1.12rem;letter-spacing:-.02em}.summary{display:flex;align-items:center;gap:15px}.summary-icon{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-size:23px}.summary p{margin:4px 0 0;color:var(--muted)}.summary h2{font-size:1.3rem}.metric-row{display:flex;gap:22px;margin-top:22px}.metric strong{display:block;font-size:1.25rem}.metric span{color:var(--muted);font-size:.76rem}.season-card{display:flex;flex-direction:column;justify-content:space-between;min-height:158px;background:linear-gradient(145deg,var(--surface),var(--accent-soft))}.season{font-size:1.35rem;font-weight:750;margin-top:8px}.season-note{font-size:.85rem;color:var(--muted)}.section-head{margin:26px 0 12px}.section-head h2{font-size:1.1rem;letter-spacing:-.02em}.section-head p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.room-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.room-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;transition:transform .15s,border-color .15s}.room-card:hover{transform:translateY(-2px);border-color:var(--accent)}.room-link{margin-bottom:15px}.room-title{font-weight:720}.arrow{color:var(--muted)}.room-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room-stat strong{display:block;font-size:1.03rem}.room-stat span{font-size:.72rem;color:var(--muted)}.room-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:15px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.77rem}.badge{padding:4px 8px;font-size:.7rem}.badge.inactive{background:var(--surface-2);color:var(--muted)}.badge.stale{background:var(--warning-soft);color:var(--warning)}.sources{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.source{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px}.source h3{font-size:.93rem}.source p{margin:8px 0 0;font-size:.77rem;color:var(--muted)}.source .error{color:var(--warning)}.detail-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.big-reading{font-size:clamp(2.8rem,8vw,4.8rem);font-weight:760;line-height:1;letter-spacing:-.06em;margin:22px 0 4px}.big-reading small{font-size:1.2rem;letter-spacing:0;color:var(--muted)}.detail-target{font-size:.95rem;color:var(--muted)}.reading-list{margin-top:22px;border-top:1px solid var(--line)}.reading{padding:11px 0;border-bottom:1px solid var(--line);font-size:.87rem}.reading span{color:var(--muted)}.reading strong{text-align:right}.entity-list{margin-top:12px}.entity{padding:12px 0;border-bottom:1px solid var(--line)}.entity:last-child{border:0}.entity-top{display:flex;justify-content:space-between;gap:12px;font-weight:650;font-size:.86rem}.entity small{display:block;color:var(--muted);font-size:.75rem;margin-top:3px}.empty{padding:18px;color:var(--muted);background:var(--surface-2);border-radius:12px}.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;color:var(--muted);font-size:.75rem}.hidden{display:none!important}
    @media(max-width:720px){main{padding:20px 14px 42px}.topbar{margin-bottom:24px}.hero,.detail-grid{grid-template-columns:1fr}.room-grid{grid-template-columns:1fr}.sources{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column;gap:12px}.card{padding:17px}.metric-row{gap:16px}.tabs{margin-right:-14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body><main>
  <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">⌂</span><div><strong>Clima di casa</strong><small>Panoramica impianto · sola lettura</small></div></div><label class="theme-picker" for="theme"><span>Tema</span><select id="theme" aria-label="Tema"><option value="auto">Automatico</option><option value="light">Chiaro</option><option value="dark">Scuro</option></select></label></header>
  <div id="app"><p class="empty">Caricamento delle stanze…</p></div>
</main>
<script>
  const $=id=>document.getElementById(id), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;};
  let latest=null;
  function systemTheme(){try{const css=getComputedStyle(parent.document.documentElement),value=css.getPropertyValue('--primary-background-color').trim()||css.getPropertyValue('--ha-card-background').trim();const m=value.match(/rgba?\((\d+)[, ]+\s*(\d+)[, ]+\s*(\d+)/);if(m){const [r,g,b]=m.slice(1).map(Number);return (r*.2126+g*.7152+b*.0722)<128?'dark':'light';}}catch(_){}return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  function setTheme(){const choice=$('theme').value;document.documentElement.dataset.theme=choice==='auto'?systemTheme():choice;}
  $('theme').value=localStorage.getItem('heating-dashboard-theme')||'auto';$('theme').addEventListener('change',()=>{localStorage.setItem('heating-dashboard-theme',$('theme').value);setTheme();});setTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if($('theme').value==='auto')setTheme();});
  function slug(text){return text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'room';}
  function rooms(data){const zones=data['2701']?.zones||[],entities=data.vicare||[],map=new Map();for(const zone of zones){const name=zone.name||`Zona ${zone.id??'?'}`,key=slug(name);map.set(key,{key,name,zone,entities:[]});}for(const entity of entities){if(!entity.area)continue;const key=slug(entity.area);if(!map.has(key))map.set(key,{key,name:entity.area,zone:null,entities:[]});map.get(key).entities.push(entity);}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'it'));}
  function chip(info){const node=el('span',`status-chip ${info.status}`);node.append(el('i','dot'),document.createTextNode(info.status==='fresh'?'Aggiornato':info.status==='stale'?'Dati non recenti':'Non disponibile'));return node;}
  function sourceCard(name,info){const box=el('div','source'),head=el('div','source-head');head.append(el('h3','',name),chip(info));box.append(head,el('p','',info.last_updated?`Ultimo aggiornamento: ${new Date(info.last_updated).toLocaleString()}`:'In attesa del primo aggiornamento'));if(info.error)box.append(el('p','error',info.error));return box;}
  function tab(label,href,current){const a=el('a',`tab${current?' current':''}`,label);a.href=href;if(current)a.setAttribute('aria-current','page');return a;}
  function format(value,unit='°C'){return value==null?'—':`${value} ${unit}`;}
  function roomCard(room){const a=el('a','room-card');a.href=`#room/${encodeURIComponent(room.key)}`;const top=el('div','room-link');top.append(el('span','room-title','⌂  '+room.name),el('span','arrow','→'));a.append(top);const stats=el('div','room-stats');for(const [label,value] of [['Ambiente',room.zone?format(room.zone.room_temperature):'—'],['Obiettivo',room.zone?format(room.zone.target_temperature):'—'],['Umidità',room.zone?format(room.zone.humidity,'%'):'—']]){const item=el('div','room-stat');item.append(el('strong','',value),el('span','',label));stats.append(item);}a.append(stats);const foot=el('div','room-foot');foot.append(el('span','',room.entities.length?`${room.entities.length} ${room.entities.length===1?'dato ViCare':'dati ViCare'}`:room.zone?'Letture 2701':'Area Home Assistant'));if(room.zone)foot.append(el('span',`badge${room.zone.active?'':' inactive'}`,room.zone.active?'Attiva':'Inattiva'));a.append(foot);return a;}
  function entityRow(entity){const row=el('div','entity'),top=el('div','entity-top');top.append(el('span','',entity.attributes?.friendly_name||entity.entity_id),el('span','',`${entity.state}${entity.attributes?.unit_of_measurement?` ${entity.attributes.unit_of_measurement}`:''}`));row.append(top);const details=['current_temperature','temperature','current_humidity','hvac_action'].filter(k=>entity.attributes?.[k]!=null).map(k=>`${k.replaceAll('_',' ')}: ${entity.attributes[k]}${k.includes('temperature')?' °C':k==='current_humidity'?' %':''}`).join(' · ');row.append(el('small','',details||entity.entity_id));return row;}
  function renderOverview(data,list){const root=el('div','');const zones=data['2701']?.zones||[],active=zones.filter(z=>z.active).length,season=data['2701']?.season;const heading=el('div','heading');heading.append(el('div','',null));heading.firstChild.append(el('div','eyebrow','La tua casa'),el('h1','','Panoramica'),el('p','','Stato aggiornato delle zone e dei sistemi collegati.'));heading.append(chip(data.sources['2701']));root.append(heading);const tabs=el('nav','tabs');tabs.setAttribute('aria-label','Navigazione');tabs.append(tab('Panoramica','#',true),tab('Impianto','#system',false));root.append(tabs);
    const hero=el('div','hero'),summary=el('section','card'),s=el('div','summary');s.append(el('span','summary-icon','⌁'));const copy=el('div','');copy.append(el('div','eyebrow','Stato complessivo'),el('h2','',zones.length?(active?`${active} ${active===1?'zona attiva':'zone attive'}`:'Nessuna zona attiva'):'Letture in attesa'),el('p','',zones.length?`${zones.length} ${zones.length===1?'zona rilevata':'zone rilevate'} dal controller`:'Il controller non ha ancora restituito zone.'));s.append(copy);summary.append(s);const metrics=el('div','metric-row');for(const [n,label] of [[zones.length,'Zone'],[data.vicare?.length||0,'Dati ViCare'],[list.length,'Stanze']]){const m=el('div','metric');m.append(el('strong','',String(n)),el('span','',label));metrics.append(m);}summary.append(metrics);hero.append(summary);const seasonal=el('section','card season-card');seasonal.append(el('div','eyebrow','Stagione rilevata'),el('div','season',season==='winter'?'Riscaldamento':season==='summer'?'Raffrescamento':'Non rilevata'),el('div','season-note',season?'Indicazione dal controller 2701':'La stagione apparirà quando disponibile'));hero.append(seasonal);root.append(hero);
    const sh=el('div','section-head');sh.append(el('div','',null));sh.firstChild.append(el('h2','','Le tue stanze'),el('p','','Le viste si aggiornano automaticamente in base alle zone e alle aree rilevate.'));root.append(sh);const grid=el('div','room-grid');if(list.length)list.forEach(r=>grid.append(roomCard(r)));else grid.append(el('p','empty','Nessuna stanza o zona rilevata. Le stanze compariranno automaticamente quando saranno disponibili.'));root.append(grid);const sources=el('div','sources');sources.append(sourceCard('Viessmann 2701',data.sources['2701']),sourceCard('ViCare · Home Assistant',data.sources.vicare));root.append(sources);root.append(el('div','footer','','Dati di sola lettura'));return root;}
  function renderRoom(data,room,list){const root=el('div',''),heading=el('div','heading'),left=el('div','');left.append(el('div','eyebrow','Vista stanza'),el('h1','',room.name),el('p','',room.zone?'Letture della zona e dati ViCare associati a quest’area.':'Dati ViCare associati all’area Home Assistant.'));heading.append(left,room.zone?el('span',`badge${room.zone.active?'':' inactive'}`,room.zone.active?'Zona attiva':'Zona inattiva'):el('span','badge','Area Home Assistant'));root.append(heading);const nav=el('nav','tabs');nav.setAttribute('aria-label','Navigazione');nav.append(tab('← Panoramica','#',false),tab('Impianto','#system',false));root.append(nav);const grid=el('div','detail-grid'),main=el('section','card');main.append(el('div','eyebrow','Temperatura ambiente'));main.append(el('div','big-reading',room.zone?format(room.zone.room_temperature):'—'));main.append(el('div','detail-target',room.zone?`Obiettivo ${format(room.zone.target_temperature)}`:'Nessuna zona 2701 associata'));const readings=el('div','reading-list');for(const [k,v] of [['Stato zona',room.zone?(room.zone.active?'Attiva':'Inattiva'):'Non disponibile'],['Umidità',room.zone?format(room.zone.humidity,'%'):'—'],['ID zona',room.zone?.id??'—']]){const row=el('div','reading');row.append(el('span','',k),el('strong','',String(v)));readings.append(row);}main.append(readings);grid.append(main);const side=el('section','card');side.append(el('div','eyebrow','ViCare · Area Home Assistant'),el('h2','','Dati associati'));const entities=room.entities||[];if(entities.length){const listNode=el('div','entity-list');entities.forEach(e=>listNode.append(entityRow(e)));side.append(listNode);}else side.append(el('p','empty','Nessuna entità ViCare assegnata a quest’area. Le altre entità restano disponibili nella vista impianto.'));grid.append(side);root.append(grid);const sources=el('div','sources');sources.append(sourceCard('Viessmann 2701',data.sources['2701']),sourceCard('ViCare · Home Assistant',data.sources.vicare));root.append(sources);return root;}
  function renderSystem(data){const root=el('div',''),heading=el('div','heading');heading.append(el('div','',null));heading.firstChild.append(el('div','eyebrow','Dettaglio'),el('h1','','Impianto'),el('p','','Dati ViCare non associati a un’area e stato delle sorgenti.'));root.append(heading);const nav=el('nav','tabs');nav.setAttribute('aria-label','Navigazione');nav.append(tab('Panoramica','#',false),tab('Impianto','#system',true));root.append(nav);const all=data.vicare||[],unassigned=all.filter(e=>!e.area),section=el('section','card');section.append(el('div','eyebrow','ViCare'),el('h2','','Entità senza stanza'));if(unassigned.length){const items=el('div','entity-list');unassigned.forEach(e=>items.append(entityRow(e)));section.append(items);}else section.append(el('p','empty','Tutte le entità ViCare sono associate a un’area oppure non ci sono entità disponibili.'));root.append(section);const sources=el('div','sources');sources.append(sourceCard('Viessmann 2701',data.sources['2701']),sourceCard('ViCare · Home Assistant',data.sources.vicare));root.append(sources);return root;}
  function render(data){setTheme();latest=data;const list=rooms(data),hash=decodeURIComponent(location.hash.slice(1));let view;if(hash.startsWith('room/')){const key=hash.slice(5),room=list.find(r=>r.key===key);view=room?renderRoom(data,room,list):renderOverview(data,list);}else if(hash==='system')view=renderSystem(data);else view=renderOverview(data,list);$('app').replaceChildren(view);}
  async function refresh(){try{const response=await fetch('api/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json());}catch(error){$('app').replaceChildren(el('p','empty',`Dashboard non disponibile: ${error.message}`));}}
  addEventListener('hashchange',()=>{if(latest)render(latest);});refresh();setInterval(refresh,15000);
</script></body></html>
