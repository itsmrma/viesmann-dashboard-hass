  function normalizedHex(value){
    const match=value.trim().match(/^#?([0-9a-f]{6}|[0-9a-f]{3})$/i);
    if(!match)return null;
    return '#'+(match[1].length===3?[...match[1]].map(c=>c+c).join(''):match[1]).toLowerCase();
  }
  function hexToHsl(hex){
    const [r,g,b]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255);

    const h=delta===0?0:max===r?((g-b)/delta+6)%6:max===g?(b-r)/delta+2:(r-g)/delta+4;

  }

    };

  }

    const available=raw!=null&&String(raw).trim()!==''&&Number.isFinite(Number(raw));
    reading.append(el('dt','',t(`system.${label}`)));
    const value=el('dd','system-value');value.append(el('span','',available?new Intl.NumberFormat(preferences.language==='it'?'it-IT':'en-GB',{maximumFractionDigits:2}).format(Number(raw)):'—'));
    if(available&&attributes.unit_of_measurement)value.append(el('small','',attributes.unit_of_measurement));
    reading.append(value);if(!available||showSource)reading.append(el('dd','system-reading-note',available?(attributes.friendly_name||entity.entity_id):t('status.unavailable')));
    return reading;
  }
  function renderSystem(data){
    const root=el('div',''),heading=el('div','heading'),intro=el('div','');
    intro.append(el('div','eyebrow',t('system.eyebrow')),el('h1','',t('system.title')),el('p','',t('system.description')));heading.append(intro);root.append(heading,navigation('system'));
    const content=el('div','system-overview');let count=0;
    for(const group of systemGroups){
      const section=el('section',`system-section system-${group.title}`),title=el('h2','');title.append(icon(group.symbol),document.createTextNode(t(`system.${group.title}`)));const readings=el('dl','system-readings');
      for(const [key,label] of group.keys){const matches=(data.vicare||[]).filter(entity=>systemMatches(entity,key));for(const entity of matches){readings.append(systemReading(entity,label,matches.length>1));count++;}}
      if(readings.children.length){section.append(title,readings);content.append(section);}
    }
    if(!count)content.append(el('p','empty',t('system.noReadings')));
    content.append(el('p','system-note',t('system.availability')));root.append(content);
    const sources=el('div','sources');sources.append(sourceCard('Viessmann 2701',data.sources['2701']),sourceCard('ViCare · Home Assistant',data.sources.vicare));root.append(sources);return root;
  }
  function render(data){latest=data;if($('color-dialog').open)return;applyPreferences();const list=rooms(data),hash=decodeURIComponent(location.hash.slice(1));let view;if(hash.startsWith('room/')){const key=hash.slice(5),room=list.find(r=>r.key===key);view=room?renderRoom(data,room,list):renderOverview(data,list);}else if(hash==='system')view=renderSystem(data);else if(hash==='settings')view=renderSettings(data);else view=renderOverview(data,list);$('app').replaceChildren(view);}
  async function refresh(){try{const response=await fetch('api/status',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);render(await response.json());}catch(error){$('app').replaceChildren(el('p','empty',t('error.dashboard',{message:error.message})));}}
  addEventListener('hashchange',()=>{if($('color-dialog').open)$('color-dialog').close();if(latest)render(latest);});refresh();setInterval(refresh,15000);
</script></body></html>
