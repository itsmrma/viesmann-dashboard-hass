<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — Vitocal + 2701 overview</title>
  <style>
    :root{font:16px/1.45 system-ui,sans-serif;color:#18242b;background:#edf2f4}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:0 auto;padding:34px 24px 110px}.eyebrow,.label{font-size:.75rem;letter-spacing:.11em;text-transform:uppercase;color:#60747e;font-weight:700}.top{display:flex;justify-content:space-between;align-items:start;gap:20px}.top h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.05;margin:.35rem 0}.stamp{background:#fff2cf;color:#795400;border-radius:99px;padding:8px 12px;font-size:.75rem;font-weight:700;white-space:nowrap}.sub{color:#5d7079;margin:.5rem 0 26px}.status{display:flex;align-items:center;gap:8px;color:#167550;font-weight:650}.dot{width:9px;height:9px;background:#21a36b;border-radius:50%;display:inline-block}.muted{color:#647780}.value{font-size:2rem;font-weight:720;letter-spacing:-.04em}.unit{font-size:.9rem;color:#60747e;font-weight:500}.panel{background:white;border:1px solid #dce5e9;border-radius:16px;padding:22px}.panel h2,.panel h3{margin:0 0 6px}.grid{display:grid;gap:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{padding:14px;background:#f4f7f8;border-radius:12px}.metric .value{font-size:1.35rem}.metric .label{letter-spacing:.06em;font-size:.66rem}.tag{border-radius:99px;background:#e7f5ee;color:#18734e;padding:5px 9px;font-size:.75rem;font-weight:700}.system-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.source{font-size:.82rem;color:#70828a}.divider{height:1px;background:#e6ecee;margin:18px 0}.hero{font-size:clamp(2.2rem,6vw,4.3rem);font-weight:750;letter-spacing:-.06em;line-height:1}.hero small{font-size:.95rem;letter-spacing:0;color:#60747e;font-weight:500}.bar{height:8px;background:#e8eef0;border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:#48a8a0;border-radius:9px}.compare-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #edf1f2}.compare-row:last-child{border:0}.compare-row .side:last-child{text-align:right}.compare-row strong{font-size:1.1rem}.compare-row em{font-style:normal;color:#7a8b92;font-size:.78rem}.vs{font-size:.7rem;color:#87969c;text-transform:uppercase;font-weight:700}.timeline{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start}.event{padding:0 0 22px 22px;border-left:2px solid #dce7e9;position:relative}.event:before{content:'';position:absolute;left:-7px;top:4px;width:11px;height:11px;border-radius:50%;background:#319c82}.event time{display:block;color:#71838b;font-size:.8rem}.event strong{display:block}.note{color:#60747e;font-size:.85rem}.wide{grid-column:1/-1}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#16272e;color:white;padding:9px 13px;border-radius:99px;box-shadow:0 8px 30px #10232b44;z-index:2}.switcher button{border:0;border-radius:50%;width:34px;height:34px;background:#30464f;color:white;font-size:1.15rem;cursor:pointer}.switcher button:hover{background:#47636e}.switcher strong{font-size:.82rem;white-space:nowrap}.prototype-banner{margin:22px 0;background:#fff2cf;color:#6d4e00;padding:12px 15px;border-radius:10px;font-size:.84rem}.pill{display:inline-block;border:1px solid #dce5e9;border-radius:99px;padding:5px 9px;color:#60747e;font-size:.76rem}.a-layout{grid-template-columns:1.2fr .8fr}.b-layout{grid-template-columns:1fr 1fr}.c-layout{grid-template-columns:1fr .72fr}.stack{display:grid;gap:16px}.big-state{display:flex;align-items:end;justify-content:space-between;gap:20px}.state-word{font-size:1.6rem;font-weight:720}.@media(max-width:700px){main{padding:22px 15px 100px}.top{display:block}.stamp{display:inline-block;margin-top:12px}.a-layout,.b-layout,.c-layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:1fr;gap:0}.compare-row{gap:8px}.hero{font-size:3rem}}
  </style>
</head>
<body>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous layout">←</button><strong id="variant-label"></strong><button id="next" aria-label="Next layout">→</button></nav>
  <script>
    // Three structurally different mock-data layouts for the combined Vitocal/2701 overview.
    const data={heat:{mode:'Heating',flow:'34.8',return:'29.1',outside:'6.2',state:'Running',updated:'2 min ago'},controller:{mode:'Heating circuit',supply:'35.0',return:'28.7',room:'20.5',state:'Active',updated:'1 min ago'}};
    const banner='<div class="prototype-banner"><strong>Prototype · simulated readings</strong> — read-only concept; no live Home Assistant data or controls.</div>';
    const vitocal=`<section class="panel"><div class="system-head"><div><div class="label">ViCare · Vitocal</div><h2>Heat pump</h2></div><span class="tag">${data.heat.state}</span></div><p class="source">Official Home Assistant ViCare integration · updated ${data.heat.updated}</p><div class="divider"></div><div class="big-state"><div><div class="label">Operating mode</div><div class="state-word">${data.heat.mode}</div></div><span class="pill">Cloud data</span></div><div class="metrics"><div class="metric"><div class="label">Flow temperature</div><div class="value">${data.heat.flow}<span class="unit"> °C</span></div></div><div class="metric"><div class="label">Return temperature</div><div class="value">${data.heat.return}<span class="unit"> °C</span></div></div><div class="metric"><div class="label">Outside temperature</div><div class="value">${data.heat.outside}<span class="unit"> °C</span></div></div></div></section>`;
    const controller=`<section class="panel"><div class="system-head"><div><div class="label">Viessmann 2701</div><h2>Heating controller</h2></div><span class="tag">${data.controller.state}</span></div><p class="source">Local PHP/XML polling · updated ${data.controller.updated}</p><div class="divider"></div><div class="big-state"><div><div class="label">Circuit state</div><div class="state-word">${data.controller.mode}</div></div><span class="pill">Local data</span></div><div class="metrics"><div class="metric"><div class="label">Supply</div><div class="value">${data.controller.supply}<span class="unit"> °C</span></div></div><div class="metric"><div class="label">Return</div><div class="value">${data.controller.return}<span class="unit"> °C</span></div></div><div class="metric"><div class="label">Room</div><div class="value">${data.controller.room}<span class="unit"> °C</span></div></div></div></section>`;
    const comparison=`<section class="panel"><div class="label">Side-by-side check</div><h2>Heating status</h2><div class="compare-row"><div class="side"><em>Vitocal · mode</em><br><strong>${data.heat.mode}</strong></div><span class="vs">mode</span><div class="side"><em>2701 · circuit</em><br><strong>${data.controller.mode}</strong></div></div><div class="compare-row"><div class="side"><em>Flow</em><br><strong>${data.heat.flow}°C</strong></div><span class="vs">Δ 0.2°</span><div class="side"><em>Supply</em><br><strong>${data.controller.supply}°C</strong></div></div><p class="note">Similar heating signals and temperatures. These labels may describe different points in the system.</p></section>`;
    const freshness=`<section class="panel"><div class="label">Data freshness</div><h2>Sources updated recently</h2><p class="note">Freshness is shown per system because the sources update independently.</p><div class="divider"></div><p><span class="dot"></span> ViCare <strong>${data.heat.updated}</strong> <span class="source">cloud</span></p><p><span class="dot"></span> 2701 <strong>${data.controller.updated}</strong> <span class="source">local</span></p></section>`;
    const timeline=`<section class="panel"><div class="label">Now · combined system</div><h2>Heating is active</h2><p class="sub">Both sources currently report a heating state.</p><div class="timeline"><div class="event"><time>ViCare · ${data.heat.updated}</time><strong>Heat pump running</strong><span class="note">Flow ${data.heat.flow}°C · return ${data.heat.return}°C</span></div><div class="event"><time>2701 · ${data.controller.updated}</time><strong>Heating circuit active</strong><span class="note">Supply ${data.controller.supply}°C · room ${data.controller.room}°C</span></div></div></section>`;
    const detail=`<section class="panel"><div class="label">Measurements</div><h2>Temperature snapshot</h2><div class="divider"></div><div class="compare-row"><div><em>Heat pump flow</em><br><strong>${data.heat.flow}°C</strong></div><div class="vs">Vitocal</div><div class="side"><em>2701 supply</em><br><strong>${data.controller.supply}°C</strong></div></div><div class="compare-row"><div><em>Heat pump return</em><br><strong>${data.heat.return}°C</strong></div><div class="vs">2701</div><div class="side"><em>2701 return</em><br><strong>${data.controller.return}°C</strong></div></div><p class="note">Readings shown as a snapshot; no trend or inferred system health.</p></section>`;
    const variants=[{key:'A',name:'Operations board',html:`<div class="grid a-layout">${vitocal}${controller}${comparison}${freshness}</div>`},{key:'B',name:'System-by-system',html:`<div class="grid b-layout">${vitocal}${controller}<div class="wide">${comparison}</div></div>`},{key:'C',name:'Combined status',html:`<div class="grid c-layout"><div class="stack">${timeline}${detail}</div><div class="stack">${freshness}${vitocal}${controller}</div></div>`}];
    const params=new URLSearchParams(location.search);let index=Math.max(0,variants.findIndex(v=>v.key===params.get('variant')));if(index<0)index=0;
    function render(){const v=variants[index];document.title=`PROTOTYPE — ${v.name}`;document.getElementById('variant-label').textContent=`${v.key} · ${v.name}`;document.getElementById('app').innerHTML=`<header class="top"><div><div class="eyebrow">Home Assistant · read-only concept</div><h1>Heating overview</h1></div><span class="stamp">PROTOTYPE · MOCK DATA</span></header><p class="sub">Vitocal heat pump and Viessmann 2701 controller at a glance</p>${banner}${v.html}`;params.set('variant',v.key);history.replaceState({},'',`${location.pathname}?${params}`)}
    function cycle(delta){index=(index+delta+variants.length)%variants.length;render()}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
